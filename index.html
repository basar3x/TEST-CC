<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hearts Crew – Think 1 · Units 1–2</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#efeaff;--card:#fff;--tx:#241a45;--mut:#6d628f;--pk:#ff4d6d;--sun:#ffc233;--ok:#17a97a;--bad:#e5484d;--bd:#d9d0f5;--chip:#f5f1ff;--sky:#4aa8ff;--lg:#b30000;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1433;--card:#2a2250;--tx:#f6f2ff;--mut:#b4a9dc;--bd:#43388a;--chip:#352b66;--lg:#ff5a74}}
:root[data-theme="dark"]{--bg:#1a1433;--card:#2a2250;--tx:#f6f2ff;--mut:#b4a9dc;--bd:#43388a;--chip:#352b66;--lg:#ff5a74}
*{box-sizing:border-box;margin:0;font-family:'Nunito',system-ui,sans-serif}
html,body{min-height:100%}
body{background:var(--bg);color:var(--tx);display:flex;justify-content:center;padding:14px;overflow-x:hidden}
.bgp{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.bgp i{position:absolute;bottom:-60px;opacity:.13;animation:up linear infinite}
@keyframes up{to{transform:translateY(-120vh) rotate(300deg)}}
#app{width:100%;max-width:640px;position:relative;z-index:1}
h1,.q,.go,.big{font-family:'Baloo 2',sans-serif}
.ic{vertical-align:middle;flex:none}
.hud{display:flex;align-items:center;gap:8px;justify-content:space-between;margin-bottom:10px;font-weight:800;flex-wrap:wrap}
.hud>span,.hud>button{background:var(--card);border:2px solid var(--bd);border-radius:99px;padding:4px 10px;font-size:.88rem;display:inline-flex;align-items:center;gap:5px}
#hl{gap:1px!important}
.prog{height:10px;background:var(--bd);border-radius:9px;overflow:hidden;margin-bottom:16px}
.prog i{display:block;height:100%;width:0;background:var(--pk);transition:width .4s}
.panel{background:var(--card);border:3px solid var(--tx);border-radius:18px;padding:22px;box-shadow:6px 6px 0 var(--tx);transform:rotate(-.6deg);animation:panelIn .4s}
@keyframes panelIn{from{opacity:0;transform:rotate(-.6deg) translateY(12px)}to{opacity:1;transform:rotate(-.6deg)}}
.cap{display:inline-block;background:var(--sun);color:#241a45;font-weight:800;font-size:.85rem;padding:3px 10px;border:2px solid #241a45;border-radius:6px;margin-bottom:10px;transform:rotate(-2deg)}
.q{font-size:1.3rem;line-height:1.35;margin-bottom:8px;font-weight:600}
.art{display:flex;justify-content:center;margin:2px 0 12px}
.logo{width:240px;max-width:70%;height:84px;margin:0 auto 8px;background:var(--lg);-webkit-mask-image:var(--m);mask-image:var(--m);-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center}
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden;margin-bottom:14px}.bar i{display:block;height:100%;width:100%;background:var(--sun);transition:width .1s linear}
.opts{display:flex;flex-direction:column;gap:10px}.opts.row{flex-direction:row;flex-wrap:wrap}
button{cursor:pointer;color:var(--tx)}
.opts button,.tk,.mt{background:var(--chip);border:2px solid var(--bd);border-radius:12px;padding:13px 16px;font-size:1.02rem;font-weight:800;text-align:left;transition:transform .15s,border-color .15s}
.opts button:hover:not(:disabled),.tk:hover,.mt:hover:not(.ok){transform:translateY(-3px);border-color:var(--pk)}
button:focus-visible,input:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.ok{background:var(--ok)!important;color:#fff!important;border-color:var(--ok)!important}
.bad{background:var(--bad)!important;color:#fff!important;border-color:var(--bad)!important;animation:shk .4s}
.gone{opacity:.2;text-decoration:line-through;pointer-events:none}
.sel{border-color:var(--pk)!important;background:var(--pk)!important;color:#fff!important}
@keyframes shk{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mg>div{display:flex;flex-direction:column;gap:10px}
.mt{width:100%;text-align:center}
.slot{min-height:58px;border:2px dashed var(--bd);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
.ph{color:var(--mut);font-weight:600}
.tk{padding:9px 14px;text-align:center}
input.t{width:100%;padding:14px;border-radius:12px;border:2px solid var(--bd);background:var(--chip);color:var(--tx);font-size:1.1rem;font-weight:800;margin-bottom:6px}
.hint{color:var(--mut);font-size:.88rem;margin-bottom:10px}
.go{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--pk);color:#fff;border:3px solid #241a45;border-radius:99px;padding:9px 26px;font-size:1.08rem;font-weight:800;box-shadow:0 4px 0 #241a45;margin:12px 4px 0;transition:transform .1s,box-shadow .1s}
.go:disabled{opacity:.4;cursor:not-allowed}.go:active{transform:translateY(3px);box-shadow:0 1px 0 #241a45}
.go.alt{background:var(--card);color:var(--tx)}
.wc{color:var(--pk)!important;border-color:var(--pk)!important}.wc:disabled{opacity:.35}
.lnk{background:none;border:0;color:var(--mut);font-size:.8rem;text-decoration:underline;margin-top:10px}
.fb{margin-top:14px;padding:14px;border-radius:12px;border-left:6px solid var(--ok);background:var(--chip);animation:pop .3s}
.fb.b{border-left-color:var(--bad)}.fb b{display:block;font-family:'Baloo 2';font-size:1.1rem}
@keyframes pop{from{transform:scale(.95);opacity:0}}
.big{font-size:2.4rem;font-weight:800;line-height:1.1;margin-bottom:8px}
.center{text-align:center}.mut{color:var(--mut)}
.nm{padding:14px 20px;border-radius:99px;border:3px solid var(--tx);background:var(--card);color:var(--tx);font-size:1.1rem;text-align:center;font-weight:800;width:80%;margin:14px 0 4px}
.rv{text-align:left;margin-top:14px;max-height:260px;overflow-y:auto}
.rv>div,.rv details div{padding:8px 10px;border-left:5px solid var(--ok);background:var(--chip);border-radius:8px;margin-bottom:8px;font-size:.9rem}.rv .x{border-left-color:var(--bad)}
.rv summary{cursor:pointer;padding:6px 2px;font-size:.92rem}
.k{color:var(--ok)}.x .k{color:var(--bad)}
.tt{width:100%;border-collapse:collapse;font-size:.85rem}.tt th,.tt td{border:1px solid var(--bd);padding:6px 8px;text-align:left}.tt th{background:var(--chip)}
.pass{color:var(--ok);font-weight:800}.fail{color:var(--bad);font-weight:800}
.conf{position:fixed;top:-40px;pointer-events:none;z-index:9;animation:fall 2s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
.pulse{animation:pulse 1.6s ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.05)}}
.ov{position:fixed;inset:0;z-index:50;background:rgba(10,6,25,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px;text-align:center}.ov img{max-height:68vh;max-width:100%;aspect-ratio:9/16;border-radius:14px;box-shadow:0 0 0 3px #fff}.ov p{color:#d8d0ff}
.hidden{display:none}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.hud>span.tr{padding:0;border:0;background:none;position:relative;width:44px;height:44px}.tr b{position:absolute;inset:0;display:grid;place-items:center;font-size:.85rem}
.seg{display:flex;gap:3px;margin-bottom:14px}.seg i{flex:1;height:8px;border-radius:9px;background:var(--bd)}.seg i.o{background:var(--ok)}.seg i.b{background:var(--bad)}.seg i.c{background:var(--pk);animation:pulse 1.4s ease-in-out infinite}
.opts.two{flex-direction:row}.opts.two button{flex:1;text-align:center}
.kb{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:7px;background:var(--bd);font-size:.75rem;margin-right:8px;color:var(--tx)}
.ll{display:inline-flex;align-items:center;gap:6px;background:var(--chip);border:2px solid var(--bd);border-radius:99px;padding:6px 12px;font-weight:800;font-size:.85rem}.ll:disabled{opacity:.35;cursor:not-allowed}.ll:hover:not(:disabled){border-color:var(--pk)}
.lls{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px;padding-top:12px;border-top:2px dashed var(--bd)}
.btnrow{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px;margin:14px 0}.tile{padding:10px;border-radius:12px;background:var(--chip);border:2px solid var(--bd);text-align:center}.tile b{display:block;font-family:'Baloo 2';font-size:1.3rem}.tile span{font-size:.75rem;color:var(--mut);font-weight:800}
.badges{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}.bdg{display:inline-flex;gap:6px;align-items:center;padding:5px 12px;border-radius:99px;background:var(--sun);color:#241a45;font-weight:800;font-size:.85rem;border:2px solid #241a45}
.rv{max-height:340px}.hint{margin-bottom:6px}
</style>
</head>

async function saveImg(kind){
 const b=$(kind===2?'#sv2':'#sv'),t0=b.innerHTML;b.disabled=true;b.textContent='Creando imagen…';

async function sendResult(){
 const rec={name:LAST.name,okc:LAST.okc,n:LAST.n,score:LAST.score,rank:LAST.rank[1],time:LAST.time,at:Date.now(),quiz:QID,ans:LAST.log.map(l=>({cap:l.cap,ok:l.ok,a:l.a||'',c:l.c}))};
 let saved=0,sent=0;
 try{const d=JSON.parse(localStorage.getItem('hcq_results')||'[]');d.push(rec);localStorage.setItem('hcq_results',JSON.stringify(d.slice(-300)));saved=1}catch(e){}
 try{const u=await claude.use('user'),d=await claude.use('db');if(u&&d){const id=await u.id();if(id){await d.collection('results').doc(id).set(rec);sent=1}}}catch(e){}
 const s=$('#sent');if(s)s.textContent=sent?'Resultado enviado a tu teacher.':saved?'Resultado guardado en este dispositivo.':'Guarda la imagen con respuestas y envíasela a tu teacher.'}
async function gate(){

async function teacher(){
 let rows=[];try{rows=JSON.parse(localStorage.getItem('hcq_results')||'[]')}catch(e){}
 try{const d=await claude.use('db');if(d)(await d.collection('results').get()).docs.forEach(x=>{const r=x.data();if(!rows.some(o=>o.name===r.name&&o.at===r.at))rows.push(r)})}catch(e){}
 rows.sort((a,b)=>b.okc-a.okc||b.score-a.score);
 const fd=a=>typeof a==='number'?new Date(a).toLocaleString('es'):(a||'');
 stage.innerHTML=`<div class="panel"><div class="cap">Teacher panel</div><p class="q">${rows.length} resultado(s)</p><div style="max-height:34vh;overflow:auto"><table class="tt"><tr><th>#</th><th>Student</th><th>Nota</th><th>Puntos</th><th>Tiempo</th></tr>${rows.map((r,k)=>`<tr><td>${k+1}</td><td>${esc(r.name)}</td><td class="${r.okc>=6?'pass':'fail'}">${r.okc}/${r.n}</td><td>${r.score}</td><td>${fmt(r.time||0)}</td></tr>`).join('')||'<tr><td colspan="5" class="mut">Aún no hay resultados.</td></tr>'}</table></div><div class="rv" style="max-height:28vh">${rows.map(r=>`<details><summary><b>${esc(r.name)}</b> · ${r.okc}/${r.n}${r.quiz?" · "+esc(r.quiz):""}</summary>${(r.ans||[]).map((a,k)=>`<div class="${a.ok?'':'x'}"><b class="k">${a.ok?'✓':'✗'}</b> ${k+1}. ${esc(a.cap)}: ${esc(a.a)}${a.ok?'':' → '+esc(a.c)}</div>`).join('')}</details>`).join('')}</div><p class="hint" style="margin-top:8px">Se muestran los resultados guardados en este dispositivo y los enviados a tu cuenta.</p><button class="go" id="csv">Descargar CSV</button><button class="go alt" id="del">Borrar datos de este dispositivo</button><button class="go alt" id="bk">Back</button></div>`;
 $('#bk').onclick=welcome;
 $('#del').onclick=function(){if(!this.dataset.s){this.dataset.s=1;this.textContent='¿Seguro? Toca otra vez';return}try{localStorage.removeItem('hcq_results')}catch(e){}teacher()};
 $('#csv').onclick=()=>{const q=v=>'"'+String(v).replace(/"/g,'""')+'"';saveFile('resultados-hearts-crew.csv','\ufeff'+['nombre,nota,puntos,tiempo,rango,fecha',...rows.map(r=>[q(r.name),r.okc+'/'+r.n,r.score,fmt(r.time||0),q(r.rank),q(fd(r.at))].join(','))].join('\n'),'text/csv')}}
welcome();
</script>
